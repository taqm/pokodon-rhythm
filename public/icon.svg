  <ellipse cx="306" cy="246" rx="15" ry="22" fill="#3d2040"/>
  <ellipse cx="256" cy="300" rx="26" ry="22" fill="#3d2040"/>
  <!-- 3 色の拍 -->
  <circle cx="186" cy="420" r="18" fill="#ff7eb3"/>
